# Quality gate for the portfolio site.
# Every push to main and every pull request must pass the `check` job.
# (The `deploy` job to GitHub Pages is added in phase 4.)
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the check job only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (html, links, lighthouse)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (for html-validate and Lighthouse CI)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: HTML is valid
        run: npx --yes html-validate@11.18.0 index.html

      - name: No broken links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --no-progress --root-dir ${{ github.workspace }} index.html
          fail: true

      - name: Lighthouse scores meet the thresholds
        run: npx --yes @lhci/cli@0.16.0 autorun

      - name: Keep the Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/report
          retention-days: 14
          if-no-files-found: ignore

