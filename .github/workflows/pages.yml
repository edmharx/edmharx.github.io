# CI/CD for the portfolio site.
#   check  : every push to main and every pull request must pass (html, links, lighthouse).
#   deploy : only after check passes, only on main, publishes to GitHub Pages.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. The deploy job asks for more, for itself only.
permissions:
  contents: read

# A newer push to the same PR cancels the older run.
# On main, runs queue instead, so a deploy is never cut off halfway.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (html, links, lighthouse)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (for html-validate and Lighthouse CI)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: HTML is valid
        run: npx --yes html-validate@11.18.0 index.html

      - name: No broken links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --no-progress --root-dir ${{ github.workspace }} index.html
          fail: true

      - name: Lighthouse scores meet the thresholds
        run: npx --yes @lhci/cli@0.16.0 autorun

      - name: Keep the Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/report
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    name: deploy to GitHub Pages
    needs: check
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write     # publish to Pages
      id-token: write  # OIDC: prove to Pages that this run is this repo's main (no stored secret)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that Pages is set to "GitHub Actions"
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Collect only the website files
        run: |
          mkdir -p _site
          cp -r index.html css js assets _site/

      - name: Package the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

